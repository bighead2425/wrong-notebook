name: Manual Docker Build & Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # 测试门禁（2026-09-24 新增 · 波 0）
  #
  # 加之前这里是个洞：发版走的正是本工作流，而它**一个测试 job 都没有** ——
  # 生产镜像未经任何测试就推到 GHCR，再由 NAS 的 watchtower 自动上线。
  # （文档原先写成"修 ci.yml:19 的 if 让 tag 发版跳过测试"——**靶心错了**：
  #   ci.yml 的 on.push.tags 只匹配 `v*`，而发版 tag 形如 `custom-v36`，不触发那条链。）
  #
  # 只挂 Unit / Integration / lint —— 这三项在 CI 上长期是绿的（2026-09-24 实测）。
  # **刻意不挂 E2E**：e2e/ 用例停在 2026-09-15，此后 UI 历经 v29–v36 大改，
  # 该 job 近 16 次运行全红（0 次成功）。挂上去等于永久卡死发版，
  # 它是一条独立的债，另行处置。
  # ============================================
  verify:
    runs-on: ubuntu-latest
    name: Test Gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint gate (no new errors vs baseline)
        run: npm run lint:gate

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 【2026-10-20 如如】**清洗 tag 输入**（custom-v108 构建失败的根因）
      #
      # 失败日志原文：
      #   ERROR: failed to build: invalid tag
      #   "ghcr.io/bighead2425/wrong-notebook: custom-v108": invalid reference format
      #                                          ↑ 冒号后面多了一个空格
      #
      # 原因：`workflow_dispatch` 的输入框**原样**拼进了 tags（`${{ inputs.tag }}`），
      # 手动填的时候多一个空格/换行就直接炸，而且炸在"已经跑完测试、镜像准备推"的最后一步。
      #
      # 修法：build 之前先清洗一遍（去所有空白 + 把 Docker 不接受的字符换成 `-` + 空值兜底 latest）。
      # ⚠️ 用 `env:` 传值而不是直接 `${{ }}` 插进 shell —— 后者等于把输入当代码执行。
      # ============================================
      - name: Normalize image tag
        id: norm
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          CLEAN=$(printf '%s' "$RAW_TAG" | tr -d '[:space:]' | sed 's/[^A-Za-z0-9._-]/-/g')
          if [ -z "$CLEAN" ]; then CLEAN=latest; fi
          echo "tag=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "input was  : [$RAW_TAG]"
          echo "using tag  : [$CLEAN]"

      # Set up QEMU for multi-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # NAS(xuanwu1) 是 amd64；arm64 走 QEMU 模拟极慢，故只构建 amd64
          platforms: linux/amd64
          # 同时打两个标签：
          #   1) 输入的具体版本号（custom-v10 等）—— 保留版本历史，可回退
          #   2) custom-latest —— 固定标签，NAS 上的自动更新程序监控它，
          #      这样在无法 SSH 到 NAS 的网络环境下（如外出办公）也能完成部署
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.norm.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:custom-latest
          # 把本次的 tag 烧进镜像（Dockerfile 的 ARG APP_VERSION）：
          # 「设置 → 关于」据此显示当前部署版本，一眼能确认 NAS 上跑的是哪一版。
          # ⚠️ 用清洗后的值，不然「关于」里会显示成 "custom-v108 "（带空格）
          build-args: |
            APP_VERSION=${{ steps.norm.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
