name: Manual Docker Build & Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      # Set up QEMU for multi-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # NAS(xuanwu1) 是 amd64；arm64 走 QEMU 模拟极慢，故只构建 amd64
          platforms: linux/amd64
          # 同时打两个标签：
          #   1) 输入的具体版本号（custom-v10 等）—— 保留版本历史，可回退
          #   2) custom-latest —— 固定标签，NAS 上的自动更新程序监控它，
          #      这样在无法 SSH 到 NAS 的网络环境下（如外出办公）也能完成部署
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:custom-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
