name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  # 【2026-10-20 如如】手动触发：E2E 只在这里跑（见 e2e-test 的 if）。
  workflow_dispatch:

jobs:
  # ============================================
  # Lint 门禁（2026-09-24 新增 · 波 0）
  #
  # 项目自己的纪律写了"避免 any、组件 >200 行要拆"，但此前**没有任何门禁**：
  # 规则文件还因为文件名拼错（.cursorrulers）从未被工具读到过。
  #
  # 采用**基线式**而非一次清零：现存 189 error（167 条是历史 any，散在 66 个文件），
  # 现在去大改这些文件会和紧接着的卡片版面重排（M3）撞车。
  # 基线门禁的效果是——存量不阻塞任何人，**新写的代码再加一个 any 就红**。
  # 详见 scripts/lint-baseline.mjs 头注。
  # ============================================
  lint:
    runs-on: ubuntu-latest
    name: Lint Gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint gate (no new errors vs baseline)
        run: npm run lint:gate

  # ============================================
  # 测试阶段（仅 main 分支 push 或 PR）
  # ============================================
  unit-test:
    runs-on: ubuntu-latest
    name: Unit Tests
    # 只在非 tag push 时运行测试
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests
    # 【2026-10-20】去掉 `needs: unit-test` —— 四个 job **并行跑**。
    # 它们之间没有真实依赖（各自 checkout + npm ci + prisma generate），
    # 串起来只是把墙钟时间累加。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run integration tests
        run: npm run test:integration

  build-check:
    runs-on: ubuntu-latest
    name: Build Check
    # 【2026-10-20】同样去掉 `needs`，与另外三个并行。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # 【2026-10-20】缓存 Next 的增量编译产物。
      # 项目越大 `next build` 越慢（今晚已到 1.9 分钟，且 E2E 里还要再 build 一次），
      # `.next/cache` 命中时通常能省掉一半。
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build application
        run: npm run build

  e2e-test:
    runs-on: ubuntu-latest
    name: E2E Tests
    # 【2026-10-20 如如】**E2E 不再跟着 push 跑，只在手动触发时跑。**
    #
    # 为什么（有数据）：
    #   · 2026-10-20 夜间两次 CI：四个门禁合计 ~4 分钟，
    #     **E2E 单个 12.8~12.9 分钟**，占了整条流水线 70% 的时间；
    #   · 更要紧的是：它**每次都红**（老账，与当次改动无关），
    #     红了也没人看 ⇒ 它一直在花钱买一个没人读的信号；
    #   · E2E 内部还要 `npm run build` 一次（build-check 里刚 build 过）。
    #
    # 现阶段判断：**先把墙钟时间拿回来**，E2E 的修复单独排期（那是另一个工程：
    # 三个 spec 是设置/登录/上传错题，与最近所有改动都无关）。
    # 要看 E2E：Actions → CI → Run workflow（手动），或本地 `npx playwright test`。
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    env:
      DATABASE_URL: "file:./e2e.db"
      NEXTAUTH_SECRET: "ci-secret-value-123456"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Setup Database
        run: |
          npx prisma db push
          npx prisma db seed

      - name: Build application
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ============================================
  # Docker 构建（仅 tag push）
  # ============================================
  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build & Push
    # 只在 tag 推送时构建镜像
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=sha,prefix=sha-

      - name: Set up QEMU (Enable multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
