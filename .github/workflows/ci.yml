name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  # 【2026-10-20 如如】手动触发：E2E 只在这里跑（见 e2e-test 的 if）。
  workflow_dispatch:

jobs:
  # ============================================
  # Lint 门禁（2026-09-24 新增 · 波 0）
  #
  # 项目自己的纪律写了"避免 any、组件 >200 行要拆"，但此前**没有任何门禁**：
  # 规则文件还因为文件名拼错（.cursorrulers）从未被工具读到过。
  #
  # 采用**基线式**而非一次清零：现存 189 error（167 条是历史 any，散在 66 个文件），
  # 现在去大改这些文件会和紧接着的卡片版面重排（M3）撞车。
  # 基线门禁的效果是——存量不阻塞任何人，**新写的代码再加一个 any 就红**。
  # 详见 scripts/lint-baseline.mjs 头注。
  # ============================================
  lint:
    runs-on: ubuntu-latest
    name: Lint Gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint gate (no new errors vs baseline)
        run: npm run lint:gate

  # ============================================
  # 测试阶段（仅 main 分支 push 或 PR）
  # ============================================
  unit-test:
    runs-on: ubuntu-latest
    name: Unit Tests
    # 只在非 tag push 时运行测试
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests
    # 【2026-10-20】去掉 `needs: unit-test` —— 四个 job **并行跑**。
    # 它们之间没有真实依赖（各自 checkout + npm ci + prisma generate），
    # 串起来只是把墙钟时间累加。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run integration tests
        run: npm run test:integration

  build-check:
    runs-on: ubuntu-latest
    name: Build Check
    # 【2026-10-20】同样去掉 `needs`，与另外三个并行。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # 【2026-10-20】缓存 Next 的增量编译产物。
      # 项目越大 `next build` 越慢（今晚已到 1.9 分钟，且 E2E 里还要再 build 一次），
      # `.next/cache` 命中时通常能省掉一半。
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build application
        run: npm run build

  e2e-test:
    runs-on: ubuntu-latest
    name: E2E Tests
    # 【2026-10-20 如如】**恢复每次 push 都跑**（空空："我们不敢冒险，时间服从质量"）。
    #
    # 上一版曾把它改成只手动触发，理由是"它一直红、占 13 分钟"。
    # 但同一次排查发现：它红**不全是老账** —— 2026-10-19 晚的主页改版
    # 把「退出」搬进设置、把齿轮换成用户名，`auth-flow.spec.ts` 里三处选择器当场失效。
    # **这正是 E2E 该干的事**，不能因为"它报的旧账"就把耳朵堵上。
    # ⇒ 这一提交里同时修好了那三处；E2E 恢复自动跑，并**不再需要等 build-check**（并行）。
    #
    # ⚠️ 若这次仍红：**必须继续修到绿**，不许再"关掉当解决"。
    timeout-minutes: 60
    env:
      DATABASE_URL: "file:./e2e.db"
      NEXTAUTH_SECRET: "ci-secret-value-123456"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Setup Database
        run: |
          npx prisma db push
          npx prisma db seed

      - name: Build application
        run: npm run build

      - name: Run Playwright tests
        id: pw
        run: npx playwright test --reporter=line 2>&1 | tee /tmp/pw.log
        env:
          CI: true
        # 【2026-10-20】失败**不要**让 job 立刻中断 —— 先让下面那一步把错误打成注解，
        # 否则远端只能看到一句 "Process completed with exit code 1"，等于盲修。
        continue-on-error: true

      # 【2026-10-20】把 Playwright 的失败行写成 `::error::` 注解。
      # 目的：GitHub 的 job 日志匿名拿不到（403），但**注解是匿名可读的** ——
      # 下一棒/我都能直接从 `…/check-runs/<id>/annotations` 拿到"哪个用例、哪一行、报了什么"，
      # 不用再靠猜（这次就是因为看不到内容，先误判成"老账"）。
      - name: Surface failures as annotations
        if: steps.pw.outcome == 'failure'
        run: |
          echo "=== failing lines ==="
          grep -nE "✘|✓|Error:|Timed out|expect\(|waiting for|locator" /tmp/pw.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "====================="
          tail -60 /tmp/pw.log
          exit 1

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ============================================
  # Docker 构建（仅 tag push）
  # ============================================
  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build & Push
    # 只在 tag 推送时构建镜像
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=sha,prefix=sha-

      - name: Set up QEMU (Enable multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
